<style>
/* One 9:16 column, horizontal tree that pans and zooms, controls floating on top.
   Dark-first palette: ink background, gold accent from the tunduk; light variant is warm paper. */
:root{
  color-scheme:dark;
  --bg:#0b0c0e; --card:#141517; --card2:#1f2023; --gold:#f0b84a; --goldline:#6f5a2c;
  --line:#4a4c52; --muted:#9a9aa0; --text:#f5f5f5; --ongold:#2b1d00;
  --rootbg:#f4f4f4; --roottext:#0b0c0e; --rootline:#ffffff;
  --wm:#15171c; --avatarbg:#0b0c0e; --outer:#000; --chipbg:#1b1c1f; --chipline:#34363b; --danger:#ff6b6b;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f5f2ea; --card:#ffffff; --card2:#efeadd; --gold:#a9740a; --goldline:#dcc791;
    --line:#b7b0a0; --muted:#6f6a5e; --text:#17181a; --ongold:#ffffff;
    --rootbg:#17181a; --roottext:#ffffff; --rootline:#17181a;
    --wm:#ebe5d6; --avatarbg:#f5f2ea; --outer:#dcd8cc; --chipbg:#ffffff; --chipline:#d9d2bf; --danger:#e5484d;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f2ea; --card:#ffffff; --card2:#efeadd; --gold:#a9740a; --goldline:#dcc791;
  --line:#b7b0a0; --muted:#6f6a5e; --text:#17181a; --ongold:#ffffff;
  --rootbg:#17181a; --roottext:#ffffff; --rootline:#17181a;
  --wm:#ebe5d6; --avatarbg:#f5f2ea; --outer:#dcd8cc; --chipbg:#ffffff; --chipline:#d9d2bf; --danger:#e5484d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0}
body{
  background:var(--outer); color:var(--text);
  font-family:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none; -webkit-font-smoothing:antialiased; overflow:hidden;
}
.app{position:relative; overflow:hidden; background:var(--bg); height:100vh; height:100dvh; aspect-ratio:9/16; max-width:100%}

.stage{position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab}
.stage:active{cursor:grabbing}
.wm{position:absolute; left:50%; top:50%; width:92%; transform:translate(-50%,-50%); color:var(--wm); pointer-events:none}
.glow{position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 50%, rgba(240,184,74,.06), transparent 60%)}

#tree{position:absolute; left:0; top:0; padding:40px; transform-origin:0 0; width:max-content}
#links{position:absolute; left:0; top:0; pointer-events:none; overflow:visible}
#links path{fill:none; stroke:var(--line); stroke-width:2}
#content{position:relative}

.branch{display:flex; align-items:center}
.children{display:flex; flex-direction:column; gap:14px; margin-left:72px}

.pill{
  display:flex; align-items:center; gap:10px; height:52px; padding:0 10px 0 7px; min-width:130px;
  border-radius:26px; background:var(--card); border:1.5px solid var(--goldline);
  color:var(--text); font-weight:600; font-size:18px; letter-spacing:.005em; white-space:nowrap; will-change:transform;
}
.pill .avatar{width:38px; height:38px; border-radius:50%; background:var(--avatarbg); border:1.5px solid var(--gold); color:var(--gold); display:grid; place-items:center; flex:none}
.pill .avatar svg{width:25px; height:25px}
.pill .nm{padding-right:6px}
.pill .badge{margin-left:auto}
.pill.root{background:var(--rootbg); color:var(--roottext); border-color:var(--rootline)}
.pill.girl{border-style:dashed}
.pill.girl .avatar{border-color:var(--muted); color:var(--muted)}
.pill.kids{cursor:pointer}
.pill.sel{background:#2f6bff; border-color:#9bb8ff; color:#fff}
.pill.sel .avatar{background:#1f4fd1; border-color:#fff; color:#fff}
body.admin .pill{cursor:pointer}
.badge{min-width:26px; height:26px; border-radius:13px; background:var(--gold); color:var(--ongold); font-size:14px; font-weight:800; display:grid; place-items:center; padding:0 7px}

.emptymsg{position:absolute; left:0; right:0; top:46%; text-align:center; color:var(--muted); font-size:17px; font-weight:500; padding:0 30px; pointer-events:none}
.addfirst{height:54px; padding:0 24px; border-radius:28px; border:1.5px dashed var(--gold); background:transparent; color:var(--gold); font:700 17px "Inter",sans-serif; cursor:pointer}

header{position:absolute; top:0; left:0; right:0; z-index:10; padding:max(18px, env(safe-area-inset-top,0px)) 12px 24px; display:flex; flex-direction:column; align-items:center; pointer-events:none; background:linear-gradient(var(--bg) 60%, transparent)}
.logo{display:flex; align-items:center; gap:10px; pointer-events:auto; cursor:default; touch-action:manipulation; -webkit-touch-callout:none}
.logo svg{width:42px; height:42px; color:var(--text)}
.logo h1{margin:0; font-size:30px; letter-spacing:.06em; font-weight:800; color:var(--text)}

.fab{width:48px; height:48px; border-radius:50%; border:0; background:var(--chipbg); color:var(--gold); display:grid; place-items:center; cursor:pointer; font:800 14px "Inter",sans-serif; box-shadow:0 2px 10px rgba(0,0,0,.25)}
.fab:active{transform:scale(.94)}
.fab svg{width:22px; height:22px}
#themebtn{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:12}
#langbtn{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:12}
#fabs{position:absolute; right:14px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:12; display:flex; flex-direction:column; gap:10px}
body.admin #fabs{bottom:160px}
#fabs .fab{font-size:24px; font-weight:600}

#supportbtn{
  position:absolute; left:14px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:12; height:48px; padding:0 18px 0 14px;
  display:flex; align-items:center; gap:9px; border-radius:24px; border:1px solid var(--chipline);
  background:var(--chipbg); color:var(--text); font:700 15px "Inter",sans-serif; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
#supportbtn svg{width:24px; height:24px; color:var(--gold)}
#supportbtn:active{transform:scale(.96)}
body.admin #supportbtn{display:none}

#adminbar{display:none; position:absolute; top:calc(78px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:11; padding:0 10px; flex-wrap:wrap; gap:8px; justify-content:center}
body.admin #adminbar{display:flex}
#adminbar .lbl{flex-basis:100%; text-align:center; font-size:13px; color:var(--gold); letter-spacing:.04em; font-weight:700}
.chip{border:1px solid var(--chipline); background:var(--chipbg); color:var(--text); border-radius:20px; padding:10px 15px; font:700 14px "Inter",sans-serif; cursor:pointer}
.chip.primary{background:var(--gold); color:var(--ongold); border-color:var(--gold)}
.chip:active{transform:scale(.96)}

#sheet{display:none; position:absolute; left:0; right:0; bottom:0; z-index:13; background:var(--card); border-top:1px solid var(--chipline); border-radius:20px 20px 0 0; padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px)); flex-direction:column; gap:12px}
body.admin #sheet{display:flex}
#sheet .who{font-weight:700; font-size:19px; min-height:24px; text-align:center}
#sheet .who.hint{color:var(--muted); font-weight:500; font-size:15px}
#sheet .acts{display:flex; gap:8px}
.act{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:11px 4px; border:0; border-radius:12px; background:var(--card2); color:var(--text); font:600 13px "Inter",sans-serif; cursor:pointer; line-height:1.2; text-align:center}
.act i{font-style:normal; font-size:22px; color:var(--gold)}
.act.del i{color:var(--danger)}
.act:active{transform:scale(.96)}

.overlay{position:absolute; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:18px}
.overlay.show{display:flex; animation:fadein .2s ease}
.overlay.show .modal{animation:popin .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0; transform:translateY(14px) scale(.96)}to{opacity:1; transform:none}}
.modal{width:100%; max-width:340px; background:var(--card); border:1.5px solid var(--goldline); border-radius:20px; padding:22px; text-align:center}
.modal h3{margin:0 0 14px; font-size:19px; font-weight:700; color:var(--text)}
.modal .mnote{margin:-4px 0 14px; font-size:14px; line-height:1.4; color:var(--muted); font-weight:500}
.modal input{width:100%; padding:13px 14px; font:600 18px "Inter",sans-serif; border:1.5px solid var(--chipline); border-radius:12px; background:var(--bg); color:var(--text); outline:none; user-select:text; -webkit-user-select:text}
.modal input:focus{border-color:var(--gold)}
.seg{display:flex; gap:8px; margin-top:12px}
.seg button{flex:1; padding:12px 8px; border-radius:12px; border:1.5px solid var(--chipline); background:var(--bg); color:var(--text); font:700 16px "Inter",sans-serif; cursor:pointer}
.seg button.on{background:var(--gold); border-color:var(--gold); color:var(--ongold)}
.seg-note{margin-top:8px; font-size:13px; color:var(--muted); font-weight:500; min-height:17px}
.modal .row{display:flex; gap:8px; margin-top:14px; justify-content:center}
.err{color:var(--danger); font-size:14px; font-weight:500; min-height:18px; margin-top:8px}

.modal.sup{padding:26px 22px 20px}
.sup-ico{width:72px; height:72px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; color:var(--gold); background:var(--bg); border:1.5px solid var(--goldline); box-shadow:0 0 0 7px rgba(240,184,74,.10)}
.sup-ico svg{width:38px; height:38px}
.modal.sup h3{font-size:22px; margin-bottom:8px}
.sup-text{margin:0 0 20px; font-size:16px; line-height:1.45; color:var(--muted); font-weight:500}
a.wa{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:15px 16px; border-radius:16px; background:#25d366; color:#052e12; font:800 17px "Inter",sans-serif; text-decoration:none; box-shadow:0 6px 18px rgba(37,211,102,.28)}
a.wa svg{width:26px; height:26px}
a.wa:active{transform:scale(.97)}
.sup-close{margin-top:12px; background:transparent; border:0; color:var(--muted); font:600 15px "Inter",sans-serif; cursor:pointer; padding:8px 16px}

#gate{background:var(--bg); z-index:100; flex-direction:column; gap:10px}
#gate .big{width:110px; height:110px; color:var(--text)}
#gate h2{margin:6px 0 0; font-size:42px; letter-spacing:.06em; font-weight:800}
#gate p{margin:0 0 16px; color:var(--gold); font-size:16px; font-weight:600}
#gate .gbtn{width:240px; padding:15px; font:700 19px "Inter",sans-serif; color:var(--text); background:var(--card); border:1.5px solid var(--goldline); border-radius:30px; cursor:pointer}
#gate .gbtn:hover,#gate .gbtn:active{background:var(--gold); color:var(--ongold)}

#toast{position:absolute; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gold); color:var(--ongold); font-weight:700; font-size:15px; padding:11px 22px; border-radius:22px; opacity:0; transition:.3s; z-index:200; pointer-events:none; max-width:90%; text-align:center}
#toast.show{opacity:1; transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){ .overlay.show,.overlay.show .modal{animation:none} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <circle cx="50" cy="50" r="44.5" fill="none" stroke="currentColor" stroke-width="5.5"/>
    <g clip-path="url(#tclip)" fill="none" stroke="currentColor" stroke-width="3.6">

      <rect x="3" y="14" width="4" height="6" rx="1.6"/>

    <path d="M9.2 7.9c-.4.3-.8.9-.7 1.7.3 2.4 3 5.2 5.6 5.9.8.2 1.5-.2 1.9-.7.2-.3.2-.6 0-.8l-1.6-1c-.3-.2-.6-.1-.8.1l-.5.6c-1.1-.4-2.1-1.4-2.5-2.5l.6-.5c.2-.2.3-.5.1-.8l-1-1.6c-.1-.2-.4-.3-.6-.2z" fill="currentColor"/>
  </symbol>
</svg>

<div class="app" id="app">

  <div class="stage" id="stage">
    <svg class="wm"><use href="#tunduk"/></svg>
    <div class="glow"></div>
    <div id="tree">
      <svg id="links"></svg>
      <div id="content"></div>
    </div>
    <div class="emptymsg" id="emptymsg"></div>
  </div>

  <header>
    <div class="logo" id="logo"><svg viewBox="0 0 100 100"><use href="#tunduk"/></svg><h1>Санжыра</h1></div>
  </header>

  <button class="fab" id="langbtn" aria-label="Язык / Тил">КЫР</button>
  <button class="fab" id="themebtn" aria-label="Тема"></button>

  <button id="supportbtn" aria-label="Support"><svg viewBox="0 0 24 24"><use href="#headset"/></svg><span data-i="supBtn"></span></button>

  <div id="adminbar">
    <div class="lbl"><span data-i="mode"></span> · <span id="t_status"></span></div>
    <button class="chip primary" id="b_done" data-i="done"></button>
    <button class="chip" id="b_export" data-i="exp"></button>
    <button class="chip" id="b_import" data-i="imp"></button>
    <button class="chip" id="b_key" data-i="key"></button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>

  <div id="fabs">
    <button class="fab" id="zin" aria-label="+">+</button>
    <button class="fab" id="zout" aria-label="-">−</button>
    <button class="fab" id="zfit" aria-label="fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div id="sheet"><div class="who" id="who"></div><div class="acts" id="acts"></div></div>

  <div class="overlay" id="modal">
    <div class="modal">
      <h3 id="m_title"></h3>
      <div id="m_body"></div>
      <div class="err" id="m_err"></div>
      <div class="row">
        <button class="chip" id="m_cancel"></button>
        <button class="chip primary" id="m_ok"></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="support">
    <div class="modal sup">
      <div class="sup-ico"><svg viewBox="0 0 24 24"><use href="#headset"/></svg></div>
      <h3 data-i="supTitle"></h3>
      <p class="sup-text" data-i="supText"></p>
      <a class="wa" href="https://wa.me/qr/ZTBL5DWMJBEWD1" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><use href="#wa"/></svg><span data-i="supWa"></span></a>
      <button class="sup-close" id="sup_close" data-i="close"></button>
    </div>
  </div>

  <div class="overlay" id="gate">
    <svg class="big" viewBox="0 0 100 100"><use href="#tunduk"/></svg>
    <h2>Санжыра</h2>
    <p>Тилди тандаңыз · Выберите язык</p>
    <button class="gbtn" data-l="ky">Кыргызча</button>
    <button class="gbtn" data-l="ru">Русский</button>
  </div>

  <div id="toast"></div>
</div>
